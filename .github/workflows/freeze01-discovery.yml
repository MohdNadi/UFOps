name: FREEZE-01 Discovery Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - freeze-01-discovery
    paths:
      - 'src/UFOps.Discovery/**'
      - 'tests/UFOps.Discovery.Tests/**'
      - 'docs/FREEZE-01-DISCOVERY.md'
      - 'UFOps.slnx'
      - '.github/workflows/freeze01-discovery.yml'

jobs:
  discovery-build-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Verify exact frozen Foundation ancestry and immutability
        shell: pwsh
        run: |
          $frozen = 'df47e5f1b6d8b64c5b838a845f0d8f42e7bde664'
          git merge-base --is-ancestor $frozen HEAD
          if ($LASTEXITCODE -ne 0) { throw 'FREEZE-01 is not descended from the exact frozen FREEZE-00 commit.' }

          $protected = @(
            'src/UFOps.Core',
            'src/UFOps.EngineSdk',
            'src/UFOps.Foundation.Storage',
            'src/UFOps.Foundation.Host',
            'tests/UFOps.Foundation.Tests',
            'docs/FREEZE-00-FOUNDATION.md',
            '.github/workflows/freeze00-foundation.yml',
            'Directory.Build.props',
            'Directory.Packages.props',
            'global.json'
          )
          $changes = git diff --name-only $frozen HEAD -- $protected
          if ($changes) {
            $changes | Write-Host
            throw 'Frozen FREEZE-00 content changed inside FREEZE-01.'
          }

      - name: Verify committed dependency lock set
        shell: pwsh
        run: |
          $expected = @(
            '.\src\UFOps.Core\packages.lock.json',
            '.\src\UFOps.EngineSdk\packages.lock.json',
            '.\src\UFOps.Foundation.Storage\packages.lock.json',
            '.\src\UFOps.Foundation.Host\packages.lock.json',
            '.\src\UFOps.Discovery\packages.lock.json',
            '.\tests\UFOps.Foundation.Tests\packages.lock.json',
            '.\tests\UFOps.Discovery.Tests\packages.lock.json'
          )
          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing required lock file: $path" }
          }
          $actual = @(Get-ChildItem -Path . -Filter packages.lock.json -Recurse -File)
          if ($actual.Count -ne $expected.Count) {
            throw "Expected exactly $($expected.Count) package lock files, found $($actual.Count)."
          }

      - name: Restore in NuGet locked mode
        shell: pwsh
        run: |
          dotnet restore .\UFOps.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "Locked restore failed: $LASTEXITCODE" }
          $lockDrift = git status --porcelain --untracked-files=all -- ':(glob)**/packages.lock.json'
          if ($lockDrift) {
            $lockDrift | Write-Host
            throw 'Dependency lock files changed during locked restore.'
          }

      - name: Build with warnings as errors
        shell: pwsh
        run: |
          dotnet build .\UFOps.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Release build failed: $LASTEXITCODE" }

      - name: Capture Discovery deterministic assembly baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\out\determinism -Force | Out-Null
          $assembly = '.\src\UFOps.Discovery\bin\Release\net10.0\UFOps.Discovery.dll'
          if (-not (Test-Path -LiteralPath $assembly)) { throw 'Discovery assembly missing after build.' }
          $hash = Get-FileHash -LiteralPath $assembly -Algorithm SHA256
          $hash.Hash.ToLowerInvariant() | Set-Content .\out\determinism\DISCOVERY_FIRST_SHA256.txt -Encoding ascii

      - name: Rebuild Discovery and verify deterministic assembly
        shell: pwsh
        run: |
          dotnet clean .\src\UFOps.Discovery\UFOps.Discovery.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Discovery clean failed: $LASTEXITCODE" }
          dotnet build .\src\UFOps.Discovery\UFOps.Discovery.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Discovery rebuild failed: $LASTEXITCODE" }
          $assembly = '.\src\UFOps.Discovery\bin\Release\net10.0\UFOps.Discovery.dll'
          $hash = Get-FileHash -LiteralPath $assembly -Algorithm SHA256
          $hash.Hash.ToLowerInvariant() | Set-Content .\out\determinism\DISCOVERY_SECOND_SHA256.txt -Encoding ascii
          $first = (Get-Content .\out\determinism\DISCOVERY_FIRST_SHA256.txt -Raw).Trim()
          $second = (Get-Content .\out\determinism\DISCOVERY_SECOND_SHA256.txt -Raw).Trim()
          if ($first -ne $second) { throw 'Discovery assembly is not reproducible across consecutive builds.' }

      - name: Run frozen Foundation regression tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\out\TestResults -Force | Out-Null
          $output = & dotnet test .\tests\UFOps.Foundation.Tests\UFOps.Foundation.Tests.csproj -c Release --no-build --no-restore 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath .\out\TestResults\FOUNDATION_REGRESSION.txt
          if ($exitCode -ne 0) { throw "Foundation regression tests failed: $exitCode" }

      - name: Run real Windows Discovery qualification tests
        shell: pwsh
        run: |
          $output = & dotnet test .\tests\UFOps.Discovery.Tests\UFOps.Discovery.Tests.csproj -c Release --no-build --no-restore 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath .\out\TestResults\DISCOVERY_TEST_RUN.txt
          if ($exitCode -ne 0) { throw "Discovery tests failed: $exitCode" }
          if (-not (Select-String -LiteralPath .\out\TestResults\DISCOVERY_TEST_RUN.txt -Pattern 'succeeded|passed' -CaseSensitive:$false -Quiet)) {
            throw 'Discovery test evidence does not contain a success summary.'
          }

      - name: Verify repository remains clean
        shell: pwsh
        run: |
          $changes = git status --porcelain --untracked-files=all -- ':!out/**'
          if ($changes) {
            $changes | Write-Host
            throw 'Qualification modified tracked or unexpected repository content.'
          }

      - name: Build exact FREEZE-01 evidence
        shell: pwsh
        run: |
          $evidence = '.\out\evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          Copy-Item .\out\TestResults\FOUNDATION_REGRESSION.txt $evidence\FOUNDATION_REGRESSION.txt
          Copy-Item .\out\TestResults\DISCOVERY_TEST_RUN.txt $evidence\DISCOVERY_TEST_RUN.txt
          Copy-Item .\out\determinism\DISCOVERY_FIRST_SHA256.txt $evidence\DISCOVERY_FIRST_SHA256.txt
          Copy-Item .\out\determinism\DISCOVERY_SECOND_SHA256.txt $evidence\DISCOVERY_SECOND_SHA256.txt

          $commitSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commitSha -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve one exact commit SHA for evidence binding.'
          }
          $treeSha = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $treeSha -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve one exact tree SHA for evidence binding.'
          }
          if ($commitSha -ne $env:GITHUB_SHA) {
            throw "Checked-out commit $commitSha does not match GITHUB_SHA $env:GITHUB_SHA."
          }
          $commitSha | Set-Content $evidence\COMMIT_SHA.txt -Encoding ascii
          $treeSha | Set-Content $evidence\TREE_SHA.txt -Encoding ascii

          Get-ComputerInfo | Out-String | Set-Content $evidence\WINDOWS_ENVIRONMENT.txt -Encoding utf8
          dotnet --info | Set-Content $evidence\DOTNET_INFO.txt -Encoding utf8
          @(
            'Gate: FREEZE-01 Discovery',
            "Commit: $commitSha",
            "Tree: $treeSha",
            "Run: $env:GITHUB_RUN_ID",
            'Frozen FREEZE-00 ancestry/immutability: PASS',
            'NuGet locked restore: PASS',
            'Warnings-as-errors build: PASS',
            'Discovery deterministic assembly rebuild: PASS',
            'Foundation regression tests: PASS',
            'Real Windows Discovery tests: PASS',
            'Unicode/Arabic paths: TESTED',
            'Long path >260: TESTED',
            'Inaccessible Windows path: TESTED',
            'Reparse/junction no-traversal: TESTED',
            'Cancellation: TESTED',
            'Duplicate/overlapping roots: TESTED',
            '5,000-file performance budget: TESTED',
            'Repository drift: NONE',
            'Freeze status: CANDIDATE — evidence review required'
          ) | Set-Content $evidence\FREEZE01_EVIDENCE.txt -Encoding utf8
          Get-ChildItem $evidence -File | Sort-Object Name | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), $_.Name
          } | Set-Content $evidence\MANIFEST_SHA256.txt -Encoding ascii
          Compress-Archive -Path $evidence\* -DestinationPath .\out\FREEZE01_DISCOVERY_CANDIDATE_EVIDENCE.zip -CompressionLevel Optimal -Force

      - name: Upload FREEZE-01 evidence
        uses: actions/upload-artifact@v4
        with:
          name: FREEZE01_DISCOVERY_CANDIDATE_EVIDENCE
          path: .\out\FREEZE01_DISCOVERY_CANDIDATE_EVIDENCE.zip
          if-no-files-found: error
          retention-days: 30
