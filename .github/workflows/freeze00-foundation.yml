name: FREEZE-00 Foundation Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - freeze-00-foundation
    paths:
      - 'src/**'
      - 'tests/**'
      - 'schemas/**'
      - 'docs/FREEZE-00-FOUNDATION.md'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'UFOps.slnx'
      - '.github/workflows/freeze00-foundation.yml'

jobs:
  foundation-build-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Restore and generate NuGet lock files
        shell: pwsh
        run: dotnet restore .\UFOps.slnx

      - name: Build with warnings as errors
        shell: pwsh
        run: dotnet build .\UFOps.slnx -c Release --no-restore

      - name: Run real Foundation tests with Microsoft.Testing.Platform
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\out\TestResults -Force | Out-Null
          $output = & dotnet test .\tests\UFOps.Foundation.Tests\UFOps.Foundation.Tests.csproj -c Release --no-build --no-restore --results-directory .\out\TestResults 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath .\out\TestResults\FOUNDATION_TEST_RUN.txt
          if ($exitCode -ne 0) { throw "Foundation tests failed with exit code $exitCode" }
          if (-not (Select-String -LiteralPath .\out\TestResults\FOUNDATION_TEST_RUN.txt -Pattern 'succeeded|passed' -CaseSensitive:$false -Quiet)) {
            throw 'Foundation test evidence does not contain a success summary.'
          }

      - name: Publish self-contained WinUI Foundation host
        shell: pwsh
        run: |
          dotnet publish .\src\UFOps.Foundation.Host\UFOps.Foundation.Host.csproj -c Release -r win-x64 --no-restore --self-contained true -o .\out\FoundationHost
          if (-not (Test-Path -LiteralPath .\out\FoundationHost\UFOps.Foundation.Host.exe)) {
            throw 'Foundation host executable was not produced.'
          }

      - name: Verify dependency lock files were generated
        shell: pwsh
        run: |
          $projects = @(
            '.\src\UFOps.Core\packages.lock.json',
            '.\src\UFOps.EngineSdk\packages.lock.json',
            '.\src\UFOps.Foundation.Storage\packages.lock.json',
            '.\src\UFOps.Foundation.Host\packages.lock.json',
            '.\tests\UFOps.Foundation.Tests\packages.lock.json'
          )
          foreach ($path in $projects) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing required lock file: $path" }
          }

      - name: Build evidence package
        shell: pwsh
        run: |
          $evidence = '.\out\evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          Copy-Item .\out\TestResults\FOUNDATION_TEST_RUN.txt $evidence\FOUNDATION_TEST_RUN.txt
          dotnet --info | Set-Content -LiteralPath $evidence\DOTNET_INFO.txt -Encoding utf8
          Get-ChildItem -Path . -Filter packages.lock.json -Recurse | Sort-Object FullName | ForEach-Object {
            $safeName = ($_.FullName.Substring((Get-Location).Path.Length + 1) -replace '[\\/:*?"<>|]', '_')
            Copy-Item $_.FullName (Join-Path $evidence $safeName)
          }
          Get-ChildItem .\out\FoundationHost -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring((Resolve-Path .\out\FoundationHost).Path.Length + 1)
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), $relative
          } | Set-Content -LiteralPath $evidence\FOUNDATION_HOST_SHA256.txt -Encoding utf8
          @(
            'Gate: FREEZE-00 Foundation',
            "Commit: $env:GITHUB_SHA",
            "Run: $env:GITHUB_RUN_ID",
            'Restore: PASS',
            'Build: PASS',
            'Real Foundation tests: PASS',
            'WinUI Foundation host publish: PASS',
            'Dependency lock generation: PASS',
            'Test runner: Microsoft.Testing.Platform',
            'Freeze status: CANDIDATE ONLY'
          ) | Set-Content -LiteralPath $evidence\FOUNDATION_EVIDENCE.txt -Encoding utf8
          Get-ChildItem $evidence -File | Sort-Object Name | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -LiteralPath $evidence\MANIFEST_SHA256.txt -Encoding ascii
          Compress-Archive -Path $evidence\* -DestinationPath .\out\FREEZE00_FOUNDATION_CANDIDATE_EVIDENCE.zip -CompressionLevel Optimal -Force

      - name: Upload Foundation evidence
        uses: actions/upload-artifact@v4
        with:
          name: FREEZE00_FOUNDATION_CANDIDATE_EVIDENCE
          path: .\out\FREEZE00_FOUNDATION_CANDIDATE_EVIDENCE.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload runnable Foundation host candidate
        uses: actions/upload-artifact@v4
        with:
          name: FREEZE00_FOUNDATION_HOST_CANDIDATE
          path: .\out\FoundationHost\**
          if-no-files-found: error
          retention-days: 30
