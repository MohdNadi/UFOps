name: FREEZE-00 Foundation Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - freeze-00-foundation
    paths:
      - 'src/**'
      - 'tests/**'
      - 'schemas/**'
      - 'docs/FREEZE-00-FOUNDATION.md'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'UFOps.slnx'
      - '.github/workflows/freeze00-foundation.yml'

jobs:
  foundation-build-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Verify committed dependency lock set
        shell: pwsh
        run: |
          $projects = @(
            '.\src\UFOps.Core\packages.lock.json',
            '.\src\UFOps.EngineSdk\packages.lock.json',
            '.\src\UFOps.Foundation.Storage\packages.lock.json',
            '.\src\UFOps.Foundation.Host\packages.lock.json',
            '.\tests\UFOps.Foundation.Tests\packages.lock.json'
          )
          foreach ($path in $projects) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing required committed lock file: $path" }
          }
          $actual = @(Get-ChildItem -Path . -Filter packages.lock.json -Recurse -File)
          if ($actual.Count -ne $projects.Count) {
            throw "Expected exactly $($projects.Count) committed lock files, found $($actual.Count)."
          }

      - name: Restore in NuGet locked mode
        shell: pwsh
        run: |
          dotnet restore .\UFOps.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "Locked restore failed: $LASTEXITCODE" }
          $lockDrift = git status --porcelain --untracked-files=all -- ':(glob)**/packages.lock.json'
          if ($lockDrift) {
            $lockDrift | Write-Host
            throw 'Dependency lock files changed during locked restore.'
          }

      - name: Build with warnings as errors
        shell: pwsh
        run: dotnet build .\UFOps.slnx -c Release --no-restore

      - name: Capture deterministic managed assembly baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\out\determinism -Force | Out-Null
          $assemblies = @(
            '.\src\UFOps.Core\bin\Release\net10.0\UFOps.Core.dll',
            '.\src\UFOps.EngineSdk\bin\Release\net10.0\UFOps.EngineSdk.dll',
            '.\src\UFOps.Foundation.Storage\bin\Release\net10.0\UFOps.Foundation.Storage.dll'
          )
          foreach ($assembly in $assemblies) {
            if (-not (Test-Path -LiteralPath $assembly)) { throw "Missing deterministic-build target: $assembly" }
          }
          $assemblies | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_ -Algorithm SHA256
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), $_
          } | Set-Content -LiteralPath .\out\determinism\FIRST_BUILD_SHA256.txt -Encoding ascii

      - name: Rebuild and verify deterministic managed assemblies
        shell: pwsh
        run: |
          dotnet clean .\UFOps.slnx -c Release
          if ($LASTEXITCODE -ne 0) { throw "Clean failed: $LASTEXITCODE" }
          dotnet build .\UFOps.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Second build failed: $LASTEXITCODE" }
          $assemblies = @(
            '.\src\UFOps.Core\bin\Release\net10.0\UFOps.Core.dll',
            '.\src\UFOps.EngineSdk\bin\Release\net10.0\UFOps.EngineSdk.dll',
            '.\src\UFOps.Foundation.Storage\bin\Release\net10.0\UFOps.Foundation.Storage.dll'
          )
          $assemblies | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_ -Algorithm SHA256
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), $_
          } | Set-Content -LiteralPath .\out\determinism\SECOND_BUILD_SHA256.txt -Encoding ascii
          $first = Get-Content -LiteralPath .\out\determinism\FIRST_BUILD_SHA256.txt
          $second = Get-Content -LiteralPath .\out\determinism\SECOND_BUILD_SHA256.txt
          if (Compare-Object -ReferenceObject $first -DifferenceObject $second) {
            throw 'Managed Foundation assemblies are not reproducible across consecutive clean builds.'
          }

      - name: Run real Foundation tests with Microsoft.Testing.Platform
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\out\TestResults -Force | Out-Null
          $output = & dotnet test .\tests\UFOps.Foundation.Tests\UFOps.Foundation.Tests.csproj -c Release --no-build --no-restore --results-directory .\out\TestResults 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath .\out\TestResults\FOUNDATION_TEST_RUN.txt
          if ($exitCode -ne 0) { throw "Foundation tests failed with exit code $exitCode" }
          if (-not (Select-String -LiteralPath .\out\TestResults\FOUNDATION_TEST_RUN.txt -Pattern 'succeeded|passed' -CaseSensitive:$false -Quiet)) {
            throw 'Foundation test evidence does not contain a success summary.'
          }

      - name: Qualify Release-build WinUI deployment folder
        shell: pwsh
        run: |
          $candidates = @(Get-ChildItem -Path .\src\UFOps.Foundation.Host\bin\Release -Filter UFOps.Foundation.Host.exe -Recurse -File)
          if ($candidates.Count -ne 1) {
            throw "Expected exactly one Release-build Foundation host executable, found $($candidates.Count)."
          }
          $hostDir = $candidates[0].Directory.FullName
          if (-not (Test-Path -LiteralPath (Join-Path $hostDir 'Microsoft.UI.Xaml.dll'))) {
            throw 'Release-build deployment folder is missing Microsoft.UI.Xaml.dll.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $hostDir 'UFOps.Foundation.Host.dll'))) {
            throw 'Release-build deployment folder is missing UFOps.Foundation.Host.dll.'
          }
          New-Item -ItemType Directory -Path .\out\FoundationHostRelease -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $hostDir '*') -Destination .\out\FoundationHostRelease -Recurse -Force
          if (-not (Test-Path -LiteralPath .\out\FoundationHostRelease\UFOps.Foundation.Host.exe)) {
            throw 'Release-build deployment candidate was not staged.'
          }

      - name: Verify repository remains clean after qualification
        shell: pwsh
        run: |
          $changes = git status --porcelain --untracked-files=all -- ':!out/**'
          if ($changes) {
            $changes | Write-Host
            throw 'Qualification modified tracked or unexpected repository content.'
          }

      - name: Build evidence and V3 runtime candidate package
        shell: pwsh
        run: |
          $evidence = '.\out\evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          Copy-Item .\out\TestResults\FOUNDATION_TEST_RUN.txt $evidence\FOUNDATION_TEST_RUN.txt
          Copy-Item .\out\determinism\FIRST_BUILD_SHA256.txt $evidence\FIRST_BUILD_SHA256.txt
          Copy-Item .\out\determinism\SECOND_BUILD_SHA256.txt $evidence\SECOND_BUILD_SHA256.txt
          dotnet --info | Set-Content -LiteralPath $evidence\DOTNET_INFO.txt -Encoding utf8
          git rev-parse HEAD | Set-Content -LiteralPath $evidence\COMMIT_SHA.txt -Encoding ascii
          Get-ChildItem -Path . -Filter packages.lock.json -Recurse -File | Sort-Object FullName | ForEach-Object {
            $safeName = ($_.FullName.Substring((Get-Location).Path.Length + 1) -replace '[\\/:*?"<>|]', '_')
            Copy-Item $_.FullName (Join-Path $evidence $safeName)
          }
          Get-ChildItem .\out\FoundationHostRelease -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring((Resolve-Path .\out\FoundationHostRelease).Path.Length + 1)
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), $relative
          } | Set-Content -LiteralPath $evidence\FOUNDATION_HOST_RELEASE_SHA256.txt -Encoding ascii
          @(
            'Gate: FREEZE-00 Foundation',
            "Commit: $env:GITHUB_SHA",
            "Run: $env:GITHUB_RUN_ID",
            'NuGet locked restore: PASS',
            'Warnings-as-errors build: PASS',
            'Managed assembly reproducibility: PASS',
            'Real Foundation tests: PASS',
            'WinUI Release-build deployment staging: PASS',
            'Dependency lock drift: NONE',
            'Unexpected repository drift: NONE',
            'Test runner: Microsoft.Testing.Platform',
            'V1/V2 publish-path runtime qualification failed on the target Windows 11 device.',
            'V3 deliberately uses the qualified Release-build output instead of dotnet publish.',
            'Freeze status: CANDIDATE ONLY — interactive Windows runtime qualification still required'
          ) | Set-Content -LiteralPath $evidence\FOUNDATION_EVIDENCE.txt -Encoding utf8
          Get-ChildItem $evidence -File | Sort-Object Name | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -LiteralPath $evidence\MANIFEST_SHA256.txt -Encoding ascii
          Compress-Archive -Path $evidence\* -DestinationPath .\out\FREEZE00_FOUNDATION_CANDIDATE_EVIDENCE.zip -CompressionLevel Optimal -Force

          $runtimeRoot = '.\out\runtime-package-v3'
          New-Item -ItemType Directory -Path $runtimeRoot -Force | Out-Null
          Copy-Item .\out\FoundationHostRelease\* $runtimeRoot -Recurse -Force
          @(
            'UFOps FREEZE-00 Foundation Runtime Qualification Candidate V3',
            "Commit: $env:GITHUB_SHA",
            'Deployment source: qualified Release-build output (not dotnet publish).',
            'Purpose: bypass the confirmed publish-only WinUI startup-failure path while preserving the same real Foundation host.',
            'Expected visible result after launch: Foundation health: PASS.',
            'This is a qualification host, not the final product UI.'
          ) | Set-Content -LiteralPath $runtimeRoot\RUNTIME_QUALIFICATION.txt -Encoding utf8
          Get-ChildItem $runtimeRoot -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring((Resolve-Path $runtimeRoot).Path.Length + 1)
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), $relative
          } | Set-Content -LiteralPath $runtimeRoot\MANIFEST_SHA256.txt -Encoding ascii
          Compress-Archive -Path $runtimeRoot\* -DestinationPath .\out\FREEZE00_FOUNDATION_RUNTIME_QUALIFICATION_V3.zip -CompressionLevel Optimal -Force

      - name: Upload Foundation evidence
        uses: actions/upload-artifact@v4
        with:
          name: FREEZE00_FOUNDATION_CANDIDATE_EVIDENCE
          path: .\out\FREEZE00_FOUNDATION_CANDIDATE_EVIDENCE.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload single V3 runtime qualification package
        uses: actions/upload-artifact@v4
        with:
          name: FREEZE00_FOUNDATION_RUNTIME_QUALIFICATION_V3
          path: .\out\FREEZE00_FOUNDATION_RUNTIME_QUALIFICATION_V3.zip
          if-no-files-found: error
          retention-days: 30
