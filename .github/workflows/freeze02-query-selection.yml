name: FREEZE-02 Query Selection Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - freeze-02-query-selection
    paths:
      - 'src/UFOps.Query/**'
      - 'tests/UFOps.Query.Tests/**'
      - 'docs/FREEZE-02-QUERY-SELECTION.md'
      - 'UFOps.slnx'
      - '.github/workflows/freeze02-query-selection.yml'

jobs:
  query-build-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Verify exact frozen FREEZE-01 ancestry and bounded delta
        shell: pwsh
        run: |
          $frozen = '316f49c63f28bb52c309ae64a8bb70f81bf6dac2'
          git merge-base --is-ancestor $frozen HEAD
          if ($LASTEXITCODE -ne 0) { throw 'FREEZE-02 is not descended from the exact frozen FREEZE-01 commit.' }

          $allowedExact = @(
            'UFOps.slnx',
            'docs/FREEZE-02-QUERY-SELECTION.md',
            '.github/workflows/freeze02-query-selection.yml'
          )
          $changes = @(git diff --name-only $frozen HEAD)
          $unexpected = @($changes | Where-Object {
            $_ -notin $allowedExact -and
            -not $_.StartsWith('src/UFOps.Query/', [System.StringComparison]::Ordinal) -and
            -not $_.StartsWith('tests/UFOps.Query.Tests/', [System.StringComparison]::Ordinal)
          })
          if ($unexpected.Count -gt 0) {
            $unexpected | Write-Host
            throw 'FREEZE-02 changed content outside the bounded Query gate.'
          }

      - name: Verify committed dependency lock set
        shell: pwsh
        run: |
          $expected = @(
            '.\src\UFOps.Core\packages.lock.json',
            '.\src\UFOps.EngineSdk\packages.lock.json',
            '.\src\UFOps.Foundation.Storage\packages.lock.json',
            '.\src\UFOps.Foundation.Host\packages.lock.json',
            '.\src\UFOps.Discovery\packages.lock.json',
            '.\src\UFOps.Query\packages.lock.json',
            '.\tests\UFOps.Foundation.Tests\packages.lock.json',
            '.\tests\UFOps.Discovery.Tests\packages.lock.json',
            '.\tests\UFOps.Query.Tests\packages.lock.json'
          )
          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing required lock file: $path" }
          }
          $actual = @(Get-ChildItem -Path . -Filter packages.lock.json -Recurse -File)
          if ($actual.Count -ne $expected.Count) {
            throw "Expected exactly $($expected.Count) package lock files, found $($actual.Count)."
          }

      - name: Restore in NuGet locked mode
        shell: pwsh
        run: |
          dotnet restore .\UFOps.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "Locked restore failed: $LASTEXITCODE" }
          $lockDrift = git status --porcelain --untracked-files=all -- ':(glob)**/packages.lock.json'
          if ($lockDrift) {
            $lockDrift | Write-Host
            throw 'Dependency lock files changed during locked restore.'
          }

      - name: Build with warnings as errors
        shell: pwsh
        run: |
          dotnet build .\UFOps.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Release build failed: $LASTEXITCODE" }

      - name: Capture Query deterministic assembly baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\out\determinism -Force | Out-Null
          $assembly = '.\src\UFOps.Query\bin\Release\net10.0\UFOps.Query.dll'
          if (-not (Test-Path -LiteralPath $assembly)) { throw 'Query assembly missing after build.' }
          $hash = Get-FileHash -LiteralPath $assembly -Algorithm SHA256
          $hash.Hash.ToLowerInvariant() | Set-Content .\out\determinism\QUERY_FIRST_SHA256.txt -Encoding ascii

      - name: Rebuild Query and verify deterministic assembly
        shell: pwsh
        run: |
          dotnet clean .\src\UFOps.Query\UFOps.Query.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Query clean failed: $LASTEXITCODE" }
          dotnet build .\src\UFOps.Query\UFOps.Query.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Query rebuild failed: $LASTEXITCODE" }
          $assembly = '.\src\UFOps.Query\bin\Release\net10.0\UFOps.Query.dll'
          $hash = Get-FileHash -LiteralPath $assembly -Algorithm SHA256
          $hash.Hash.ToLowerInvariant() | Set-Content .\out\determinism\QUERY_SECOND_SHA256.txt -Encoding ascii
          $first = (Get-Content .\out\determinism\QUERY_FIRST_SHA256.txt -Raw).Trim()
          $second = (Get-Content .\out\determinism\QUERY_SECOND_SHA256.txt -Raw).Trim()
          if ($first -ne $second) { throw 'Query assembly is not reproducible across consecutive builds.' }

      - name: Run frozen Foundation regression tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\out\TestResults -Force | Out-Null
          $output = & dotnet test .\tests\UFOps.Foundation.Tests\UFOps.Foundation.Tests.csproj -c Release --no-build --no-restore 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath .\out\TestResults\FOUNDATION_REGRESSION.txt
          if ($exitCode -ne 0) { throw "Foundation regression tests failed: $exitCode" }

      - name: Run frozen Discovery regression tests
        shell: pwsh
        run: |
          $output = & dotnet test .\tests\UFOps.Discovery.Tests\UFOps.Discovery.Tests.csproj -c Release --no-build --no-restore 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath .\out\TestResults\DISCOVERY_REGRESSION.txt
          if ($exitCode -ne 0) { throw "Discovery regression tests failed: $exitCode" }

      - name: Run real Windows Query qualification tests
        shell: pwsh
        run: |
          $output = & dotnet test .\tests\UFOps.Query.Tests\UFOps.Query.Tests.csproj -c Release --no-build --no-restore 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath .\out\TestResults\QUERY_TEST_RUN.txt
          if ($exitCode -ne 0) { throw "Query tests failed: $exitCode" }
          if (-not (Select-String -LiteralPath .\out\TestResults\QUERY_TEST_RUN.txt -Pattern 'succeeded|passed' -CaseSensitive:$false -Quiet)) {
            throw 'Query test evidence does not contain a success summary.'
          }

      - name: Verify repository remains clean
        shell: pwsh
        run: |
          $changes = git status --porcelain --untracked-files=all -- ':!out/**'
          if ($changes) {
            $changes | Write-Host
            throw 'Qualification modified tracked or unexpected repository content.'
          }

      - name: Build exact FREEZE-02 evidence
        shell: pwsh
        run: |
          $evidence = '.\out\evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          Copy-Item .\out\TestResults\FOUNDATION_REGRESSION.txt $evidence\FOUNDATION_REGRESSION.txt
          Copy-Item .\out\TestResults\DISCOVERY_REGRESSION.txt $evidence\DISCOVERY_REGRESSION.txt
          Copy-Item .\out\TestResults\QUERY_TEST_RUN.txt $evidence\QUERY_TEST_RUN.txt
          Copy-Item .\out\determinism\QUERY_FIRST_SHA256.txt $evidence\QUERY_FIRST_SHA256.txt
          Copy-Item .\out\determinism\QUERY_SECOND_SHA256.txt $evidence\QUERY_SECOND_SHA256.txt
          git rev-parse HEAD | Set-Content $evidence\COMMIT_SHA.txt -Encoding ascii
          git rev-parse 'HEAD^{tree}' | Set-Content $evidence\TREE_SHA.txt -Encoding ascii
          Get-ComputerInfo | Out-String | Set-Content $evidence\WINDOWS_ENVIRONMENT.txt -Encoding utf8
          dotnet --info | Set-Content $evidence\DOTNET_INFO.txt -Encoding utf8
          @(
            'Gate: FREEZE-02 Query Selection',
            "Commit: $env:GITHUB_SHA",
            "Run: $env:GITHUB_RUN_ID",
            'Exact FREEZE-01 ancestry and bounded delta: PASS',
            'NuGet locked restore: PASS',
            'Warnings-as-errors build: PASS',
            'Query deterministic assembly rebuild: PASS',
            'Foundation regression tests: PASS',
            'Discovery regression tests: PASS',
            'Real Windows Query tests: PASS',
            'SOURCE -> INCLUDE -> EXCLUDE -> EXCEPT precedence: TESTED',
            'EXCEPT cannot bypass INCLUDE: TESTED',
            'Exact/glob/extension/kind/size rules: TESTED',
            'Explicit case policy: TESTED',
            'Unicode/Arabic with real Discovery integration: TESTED',
            'Invalid glob fail-closed: TESTED',
            'Cancellation and duplicate source identity: TESTED',
            'Read-only behavior: TESTED',
            '20,000-record performance budget: TESTED',
            'Repository drift: NONE',
            'Freeze status: CANDIDATE — evidence review required'
          ) | Set-Content $evidence\FREEZE02_EVIDENCE.txt -Encoding utf8
          Get-ChildItem $evidence -File | Sort-Object Name | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), $_.Name
          } | Set-Content $evidence\MANIFEST_SHA256.txt -Encoding ascii
          Compress-Archive -Path $evidence\* -DestinationPath .\out\FREEZE02_QUERY_SELECTION_CANDIDATE_EVIDENCE.zip -CompressionLevel Optimal -Force

      - name: Upload FREEZE-02 evidence
        uses: actions/upload-artifact@v4
        with:
          name: FREEZE02_QUERY_SELECTION_CANDIDATE_EVIDENCE
          path: .\out\FREEZE02_QUERY_SELECTION_CANDIDATE_EVIDENCE.zip
          if-no-files-found: error
          retention-days: 30
